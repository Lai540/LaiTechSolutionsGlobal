<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile + Responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />

    <title>LaiTech Solutions – Transforming Ideas Into Digital Reality</title>

    <!-- SEO Meta -->
    <meta
      name="description"
      content="LaiTech Solutions provides professional technology services including web development, Python programming, graphic design, and IT support. We build modern digital solutions that empower businesses."
    />
    <meta
      name="keywords"
      content="LaiTech Solutions, web development, Python programming, IT support, graphic design, business automation, software development, tech company"
    />
    <meta name="author" content="LaiTech Solutions Global" />

    <!-- Canonical (Important for Google SEO) -->
    <link rel="canonical" href="https://laitechsolutions.co.ke" />

    <!-- Open Graph (Facebook / LinkedIn / WhatsApp Preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LaiTech Solutions" />
    <meta property="og:title" content="LaiTech Solutions — Technology, Software & IT Services" />
    <meta
      property="og:description"
      content="Professional technology solutions including Python programming, web development, IT services, and digital branding."
    />
    <meta property="og:url" content="https://laitechsolutions.co.ke" />
    <meta
      property="og:image"
      content="https://storage.googleapis.com/gpt-engineer-file-uploads/vpNw4VpyydPPN4kHFyoDW5dbsnj1/social-images/social-1758607426271-phone repairs services logo icon template des - Made with PosterMyWall (3)-modified.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@laitechsolutions" />
    <meta name="twitter:title" content="LaiTech Solutions" />
    <meta
      name="twitter:description"
      content="Professional technology solutions for modern businesses."
    />
    <meta
      name="twitter:image"
      content="https://storage.googleapis.com/gpt-engineer-file-uploads/vpNw4VpyydPPN4kHFyoDW5dbsnj1/social-images/social-1758607426271-phone repairs services logo icon template des - Made with PosterMyWall (3)-modified.png"
    />

    <!-- Local favicon (correct approach for Vite + React) -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />


    <!-- Preload logo for improved LCP performance -->
    <link
      rel="preload"
      as="image"
      href="https://laitechsolutions.co.ke/logo.png"
    />

    <!-- Structured Data (SEO Boost) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "LaiTech Solutions",
      "url": "https://laitechsolutions.co.ke",
      "logo": "https://laitechsolutions.co.ke/logo.png",
      "description": "Professional technology solutions including web development, Python programming, IT support, automation, and digital branding.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "KE"
      },
      "contactPoint": [{
        "@type": "ContactPoint",
        "telephone": "+254740136761",
        "contactType": "customer support",
        "email": "info@laitechsolutions.co.ke"
      }],
      "sameAs": [
        "https://www.linkedin.com/company/laitech-solutions-global/",
        "https://twitter.com/laitechsolutions"
      ]
    }
    </script>

    <!-- Security: Safe CSP Example (optional but recommended) -->
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data:; script-src 'self'; style-src 'self' 'unsafe-inline'"> -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
